# Site Settings
theme: bulma-clean-theme
title: LAPSUM CRIATIVO
tagline: Criatividade em cada dimensão.
email: 
description: >
  Adquira modelos 3D de alta qualidade para suas produções. Explore nossa coleção de modelos 3D, desde veículos detalhados até ambientes imersivos. Perfeito para artistas, desenvolvedores de jogos e criadores de conteúdo que buscam recursos visuais excepcionais.
baseurl: ""
url: "https://lapsumcriativo.vercel.app"
permalink: pretty
favicon: "/img/Lapsum.svg"
gh_sponsor: 
#hide_share_buttons: true
fixed_navbar: top
direction: ltr #ltr, rtl, auto
force_theme: dark
langs:
  - pt
  - en
lang: pt
locale: pt_BR
timezone: America/Sao_Paulo

paginate: 10
paginate_path: "/blog/page:num"
excerpt_separator: <!--more-->

disqus:
  # Disable comments for any post by adding `comments: false` to that post's YAML Front Matter.
  shortname:

include: [llms.txt]

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
#  - jekyll-seo-tag
  - kramdown-parser-gfm
  - jekyll-redirect-from

exclude: 
  - Gemfile
  - clean-theme.gemspec
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .vscode/
  - .github/
# Páginas
  - _includes/gallery.html
  - gallery.md
  - example-recipe.md
  - links.md
  - landing.md
  - promo-page.md
  - showcase.md
  - sponsors.md
  - _posts/
  - blog/


livereload: true

sass:
  style: compressed
  source_dir: _sass
  quiet_deps: true
  # load_paths: 
    # - node_modules

#google_analytics: UA-code-here
cookie_policy: /cookie-policy/

og_image: /img/og-cover.png

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      show_sidebar: true
  -
    scope:
      path: ""
      type: "posts"
    values:
      author: "Lapsum Criativo"
      layout: post
      image:
      show_sidebar: true
  - scope:
      path: ""
    values:
      image: /img/og-cover.png

markdown: kramdown
highlighter: rouge

footer_menu: footer_menu

collections:
  products: 
    output: true
    layout: product
    image: 
    show_sidebar: false

social:
  facebook: #Add your Facebook
  twitter: #Add your Twitter
  google-plus: #Add your Google+
  github: #Add your GitHub
  instagram: #Add your Instagram
  linkedin: #Add your LinkedIn
