<head>
    {% include meta.html %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/app.css">
    <link rel="shortcut icon" type="image/png" {% if site.favicon %} href="{{ site.favicon | relative_url }}" {% else %}
        href="{{ site.baseurl }}/favicon.png" {% endif %}>

    <script>
        window.si =
            window.si ||
            function () {
                (window.siq = window.siq || []).push(arguments);
            };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <script>
        window.va =
            window.va ||
            function () {
                (window.vaq = window.vaq || []).push(arguments);
            };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script defer src="https://unpkg.com/alpinejs@3.9.0/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="{{ site.baseurl }}/assets/vendor/katex/katex.min.css">
    <script defer src="{{ site.baseurl }}/assets/vendor/katex/katex.min.js"></script>

    <script defer src="{{ site.baseurl }}/assets/vendor/katex/contrib/mhchem.min.js"></script>
    <script defer src="{{ site.baseurl }}/assets/vendor/katex/contrib/auto-render.min.js"></script>
    <script defer src="{{ site.baseurl }}/assets/vendor/katex/contrib/copy-tex.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderMathInElement(document.body, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                    { left: "\\(", right: "\\)", display: false },
                    { left: "\\[", right: "\\]", display: true }
                ],
                throwOnError: false
            });
        });
    </script>

    {% unless site.hide_share_buttons %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-social@1/bin/bulma-social.min.css">
    {% endunless %}
    {% if site.feed %}
    {% feed_meta %}
    {% endif %}
    {%- if site.google_analytics -%}
    {%- include google-analytics.html -%}
    {%- endif -%}
    {%- include head-scripts.html -%}
</head>
